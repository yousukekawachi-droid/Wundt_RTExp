<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#000000" />
<title>ヴントの反応時間実験 | 視覚版・約1分</title>
<!-- Version-pinned jsPsych from the official jsPsych tutorial CDN method. An internet connection is required to load these files. -->
<script src="https://unpkg.com/jspsych@8.3.0"></script>
<script src="https://unpkg.com/@jspsych/plugin-html-button-response@2.1.0"></script>
<link rel="stylesheet" href="https://unpkg.com/jspsych@8.3.0/css/jspsych.css" />
<style>
:root{color-scheme:dark;--paper:#000000;--ink:#f5f7fb;--soft:#a5adba;--border:#30363f;--yellow:#f4c650}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--paper)!important;color:var(--ink);font-family:system-ui,-apple-system,"Yu Gothic","Hiragino Kaku Gothic ProN",Meiryo,sans-serif}
body{overscroll-behavior:none;-webkit-tap-highlight-color:transparent;background:#000!important;color:#f5f7fb!important}
.jspsych-display-element{background:var(--paper)!important;color:var(--ink)!important}
.jspsych-content-wrapper{min-height:100dvh;display:flex;align-items:center;justify-content:center;background:#000!important}
.jspsych-content{width:min(100%,600px);max-width:600px;padding:20px 18px;text-align:center;background:#000!important;color:#f5f7fb!important}
.jspsych-btn{background:#26334a;border:1px solid #3b4556;color:#fff;border-radius:9px;padding:13px 24px;min-height:48px;font-size:16px;font-weight:700;cursor:pointer;margin:22px auto 0}
.jspsych-btn:hover{background:#3e5274}
.sheet{padding:clamp(16px,3vw,28px);text-align:left}
.sheet h1{font-size:clamp(25px,5vw,32px);line-height:1.4;margin:0 0 22px;font-weight:750}
.sheet p{font-size:16px;line-height:1.9;margin:12px 0}
.sheet .muted{font-size:13px;line-height:1.7;color:var(--soft)}
.sheet .action-guide{background:#151922;border:1px solid #30363f;padding:12px 15px;border-radius:9px;margin:20px 0;font-size:15px;line-height:1.8}
.sheet .note{font-size:14px;color:var(--soft)}
.note{font-size:14px;color:var(--soft)}
.sheet.center{text-align:center}
/* During trials, the stimulus stage occupies the *entire viewport*. No vertical cropping. */
.trial-screen{position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;background:#000000;z-index:100;overflow:hidden;touch-action:manipulation}
.trial-stage{position:absolute;inset:0;display:flex;justify-content:center;align-items:center;border:8px solid transparent;outline:0;background:#000000;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.trial-stage.cue{border-color:var(--yellow)}
.fixation{font-size:clamp(30px,5vmin,40px);line-height:1;color:#aab3c0;font-weight:300}
.target{width:clamp(36px,8vmin,56px);height:clamp(36px,8vmin,56px);background:#fff;border-radius:50%}
.feedback{font-size:22px;font-weight:600;color:#fff}
.trial-meta,.trial-hint{position:absolute;left:0;right:0;color:#b6bfcc;font-size:13px;text-align:center;pointer-events:none;z-index:1}
.trial-meta{top:max(14px,env(safe-area-inset-top));letter-spacing:.04em}
.trial-hint{bottom:max(14px,env(safe-area-inset-bottom));font-size:12px}
.result-list{margin:25px 0 14px}
.result-row{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding:16px 0;border-bottom:1px solid var(--border)}
.result-row:first-child{border-top:1px solid var(--border)}
.result-row span{font-size:16px}
.result-row strong{font-size:clamp(22px,5vw,30px);font-weight:750;font-variant-numeric:tabular-nums;white-space:nowrap}
.result-row small{color:var(--soft);font-weight:400;font-size:12px;white-space:nowrap}
.result-note{font-size:17px;font-weight:650;line-height:1.6;margin:22px 0}
.result-meta{font-size:13px;color:var(--soft);line-height:1.8}
.jspsych-display-element, #jspsych-target, .jspsych-content, .jspsych-content-wrapper, .jspsych-html-button-response-stimulus{background:#000!important;color:#f5f7fb!important}
.jspsych-html-button-response-stimulus{width:100%}
@media(max-height:480px){.jspsych-content{padding:10px 15px}.sheet h1{margin-bottom:10px}.sheet p{line-height:1.5;margin:5px 0}.sheet .action-guide{margin:8px 0}.jspsych-btn{margin-top:10px}.trial-meta{font-size:11px}.trial-hint{font-size:11px}}
@media(max-width:380px){.jspsych-content{padding:10px 14px}.sheet{padding:6px}.sheet p{font-size:15px}.result-row small{display:block}}
</style>
</head>
<body>
<div id="jspsych-target"></div>
<script>
"use strict";
/* ==============================================================
   教員向け設定：このブロックだけで試行数・時間を変更できます。
   visual adaptation inspired by Wundt (1880), not an exact historical replica.
   ============================================================= */
const CONFIG = {
  trialsPerCondition: 8,   // 予告あり8 / 予告なし8 = 16試行
  practiceTrials: 2,       // 練習2試行（本番結果には含めない）
  cueTargetSOA: 600,       // 予告から標的まで600ms固定
  cueDuration: 180,        // 黄枠を180msだけ提示
  foreperiodMin: 1500,    // 試行開始〜標的出現時間は両条件共通
  foreperiodMax: 2500,
  maxResponseMs: 1300,     // 標的から1300msで無反応扱い
  anticipatoryThreshold: 120,
  blankAfterTrialMs: 340,  // 反応後は黒い無地の画面のみ
};

function sampleForeperiod(){
  return Math.round(CONFIG.foreperiodMin + Math.random()*(CONFIG.foreperiodMax - CONFIG.foreperiodMin));
}
function shuffledBalancedWarnings(countEach){
  const bag = Array(countEach).fill(true).concat(Array(countEach).fill(false));
  // 可能な限り同じ条件が4回以上続く配列を回避
  for(let attempt=0;attempt<300;attempt++){
    const a=[...bag];
    for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
    if(a.every((x,i)=>i<3 || !(a[i-1]===x && a[i-2]===x && a[i-3]===x))) return a;
  }
  return bag.sort(()=>Math.random()-.5);
}
function mean(numbers){return numbers.length?numbers.reduce((a,b)=>a+b,0)/numbers.length:null;}
function showMs(x){return x===null?'—':`${Math.round(x)} ms`;}

window.addEventListener('DOMContentLoaded',()=>{
 if(typeof window.initJsPsych!=='function' || typeof window.jsPsychHtmlButtonResponse==='undefined'){
   document.getElementById('jspsych-target').innerHTML=`<main class="sheet"><h1>読み込みに失敗しました</h1><p>インターネット接続を確認して，再読み込みしてください。</p><p class="muted">jsPsychの読み込みには unpkg.com への接続が必要です。</p></main>`;
   return;
 }
 const jsPsych=initJsPsych({display_element:'jspsych-target',on_finish:()=>{}});
 
 // jsPsych v8 plugin: one trial consists of foreperiod, visual warning, target, and response.
 class VisualWarningRT {
   constructor(instance){this.jsPsych=instance;}
   trial(display_element, trial){
     const meta=trial.data || {};
     const warned=meta.warned===true;
     const foreperiod=meta.foreperiod_ms;
     const isPractice=meta.phase==='practice';
     const current=meta.trial_number;
     const total=isPractice?CONFIG.practiceTrials:CONFIG.trialsPerCondition*2;
     let ended=false, targetOnset=null, cleanupDone=false;
     let targetRaf=0, cueRaf=0;
     const phaseText=isPractice?'練習':'本番';
     display_element.innerHTML=`
       <div class="trial-screen">
         <div class="trial-stage" id="rt-stage" role="button" aria-label="白い丸が出たらタップ" tabindex="0"><span id="rt-object" class="fixation">＋</span></div>
         <div class="trial-meta">${phaseText} ${current} / ${total}</div>
         <div class="trial-hint">白い丸が出たら反応</div>
       </div>`;
     const stage=display_element.querySelector('#rt-stage');
     const obj=display_element.querySelector('#rt-object');
     let result={rt:null,raw_rt:null,response:null,valid:false,early_press:false,too_fast:false,omission:false};
     const cleanup=()=>{
       if(cleanupDone)return;
       cleanupDone=true;
       document.removeEventListener('keydown',onKeyboard,true);
       stage.removeEventListener('pointerdown',onPointer);
       if(targetRaf)cancelAnimationFrame(targetRaf);
       if(cueRaf)cancelAnimationFrame(cueRaf);
     };
     const finish=()=>{
       if(ended)return;
       ended=true;
       cleanup();
       // Keep a genuinely empty BLACK screen during the inter-trial interval.
       // Replacing the entire trial view removes fixation, trial number, hints,
       // and any feedback; jsPsych never needs to show a separate gap screen.
       display_element.innerHTML='<div class="trial-screen" aria-hidden="true"></div>';
       this.jsPsych.pluginAPI.setTimeout(()=>{
         this.jsPsych.finishTrial({...result,device_input:result.response,warning_condition:warned?'warned':'unwarned'});
       },CONFIG.blankAfterTrialMs);
     };
     const handleResponse=(kind,event)=>{
       if(ended)return;
       if(event){event.preventDefault();}
       const now=performance.now();
       result.response=kind;
       if(targetOnset===null){
         result.early_press=true;
         finish();
         return;
       }
       const rt=now-targetOnset;
       result.raw_rt=Math.round(rt*10)/10;
       if(rt<CONFIG.anticipatoryThreshold){
         result.too_fast=true;
         finish();
       }else{
         result.valid=true;
         result.rt=result.raw_rt;
         finish();
       }
     };
     const onKeyboard=(e)=>{
       if(e.code==='Space' || e.key===' '){
         e.preventDefault();
         if(!e.repeat)handleResponse('space',e);
       }
     };
     const onPointer=(e)=>{
       if(e.pointerType==='mouse' && e.button!==0)return;
       handleResponse(e.pointerType==='touch'?'touch':'pointer',e);
     };
     document.addEventListener('keydown',onKeyboard,true);
     stage.addEventListener('pointerdown',onPointer,{passive:false});
     if(warned){
       this.jsPsych.pluginAPI.setTimeout(()=>{
         if(ended)return;
         cueRaf=requestAnimationFrame(()=>{
           if(ended)return;
           stage.classList.add('cue');
           this.jsPsych.pluginAPI.setTimeout(()=>{if(!ended)stage.classList.remove('cue');},CONFIG.cueDuration);
         });
       },foreperiod-CONFIG.cueTargetSOA);
     }
     this.jsPsych.pluginAPI.setTimeout(()=>{
       if(ended)return;
       targetRaf=requestAnimationFrame(()=>{
         if(ended)return;
         stage.classList.remove('cue');
         obj.className='target';
         obj.textContent='';
         targetOnset=performance.now();
         this.jsPsych.pluginAPI.setTimeout(()=>{
           if(!ended){result.omission=true;finish();}
         },CONFIG.maxResponseMs);
       });
     },foreperiod);
   }
 }
 VisualWarningRT.info={name:'wundt-visual-warning-rt',version:'1.0.0',parameters:{},data:{}};
 
 const page=(html,button,extra={})=>({type:jsPsychHtmlButtonResponse,stimulus:html,choices:[button],...extra});
 const introHtml=`<div class="sheet">
 <h1>ヴントの反応時間実験</h1>
 <p>画面中央に<strong>白い丸</strong>が出たら，できるだけ速く反応してください。</p>
 <p><strong>黄色い枠</strong>は予告です。600 ms後に白い丸が出ます。<strong>黄色い枠には反応しない</strong>でください。</p>
 <div class="action-guide">PC：スペースキー<br>スマートフォン：画面をタップ</div>
 <p class="muted">練習2試行＋本番16試行（約1分）。音は出ません。</p>
 </div>`;
 const timeline=[page(introHtml,'練習をはじめる')];
 function createTrial(warned, phase, index, matchedForeperiod=null){
   return {
     type:VisualWarningRT,
     data:{
       phase,trial_number:index,warned,
       foreperiod_ms:matchedForeperiod===null?sampleForeperiod():matchedForeperiod,
       cue_target_soa_ms:warned?CONFIG.cueTargetSOA:null,
       cue_duration_ms:warned?CONFIG.cueDuration:null,
       task:'wundt_visual_warning',
     },
     post_trial_gap:0,
   };
 }
 const practiceOrder=Math.random()<.5?[true,false]:[false,true];
 practiceOrder.forEach((warned,i)=>timeline.push(createTrial(warned,'practice',i+1)));
 timeline.push(page(`<div class="sheet center"><h1>これから本番です</h1><p>白い丸が出たら反応してください。</p><p class="muted">16試行</p></div>`,'本番をはじめる'));
 // Use exactly the same set of target-onset times in both conditions.
 // This makes the warning manipulation the only systematic timing difference.
 const foreperiodPool=Array.from({length:CONFIG.trialsPerCondition},()=>sampleForeperiod());
 const mainOrder=shuffledBalancedWarnings(CONFIG.trialsPerCondition);
 let warnedIndex=0, unwarnedIndex=0;
 mainOrder.forEach((warned,i)=>{
   const idx=warned?warnedIndex++:unwarnedIndex++;
   timeline.push(createTrial(warned,'main',i+1,foreperiodPool[idx]));
 });
 
 const resultHtml=()=>{
   const main=jsPsych.data.get().filter({phase:'main'}).values();
   const valid=main.filter(t=>t.valid===true && typeof t.rt==='number');
   const warned=valid.filter(t=>t.warned===true).map(t=>t.rt);
   const unwarned=valid.filter(t=>t.warned===false).map(t=>t.rt);
   const a=mean(warned), b=mean(unwarned);
   const early=main.filter(t=>t.early_press===true).length;
   const fast=main.filter(t=>t.too_fast===true).length;
   const miss=main.filter(t=>t.omission===true).length;
   let interpretation='どちらかの条件の有効なデータがありません。';
   if(a!==null&&b!==null){
     const delta=Math.round(Math.abs(b-a));
     interpretation= Math.abs(b-a)<.5?'両条件の平均はほぼ同じでした。':
        b>a?`予告ありの方が <strong>${delta} ms</strong> 速い結果でした。`:
            `予告なしの方が <strong>${delta} ms</strong> 速い結果でした。`;
   }
   return `<div class="sheet"><h1>実験結果</h1>
     <div class="result-list">
       <div class="result-row"><span>予告あり<br><small>有効 ${warned.length} / ${CONFIG.trialsPerCondition}試行</small></span><strong>${showMs(a)}</strong></div>
       <div class="result-row"><span>予告なし<br><small>有効 ${unwarned.length} / ${CONFIG.trialsPerCondition}試行</small></span><strong>${showMs(b)}</strong></div>
     </div>
     <p class="result-note">${interpretation}</p>
     <p class="result-meta">早押し ${early} 回／速すぎる反応 ${fast} 回／無反応 ${miss} 回</p>
     <p class="note">予告は，刺激が現れる時刻を予測する手がかりになります。</p>
     <p class="muted">Wundt（1880）の実験を参考にした教育用の視覚版です。結果は送信・保存されません。</p>
     </div>`;
 };
 timeline.push(page(resultHtml,'もう一度実験する',{
   on_finish:()=>window.location.reload(),
 }));
 jsPsych.run(timeline);
});
</script>
</body>
</html>
